<!DOCTYPE html>
<html lang="en">

    <head>            
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="This is where you invite fellow wanderers to join you and your friends on a journey through the cities that have captured your hearts.">

        <title>Global Adventures Blog</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <h1>Stay Updated with Our Adeventures!</h1>
            <p>Subscribe to our newsletter and never miss a story from the road.</p>
        </header>
        
        <section id="newsletter">
            <form action="/subscribe" method="post">
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" placeholder="info@gmail.com" required>

                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">I agree to receive email updates and promotions.</label>

                <br><br>

                <button type="submit">Subscribe Now</button>
            </form>
        </section>
    </body>
</html>
