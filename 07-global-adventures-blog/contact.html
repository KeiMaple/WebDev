<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <meta name="description" content="This is where you invite fellow wanderers to join you and your friends on a journey through the cities that have captured your hearts.">

    <head>
        <title>Global Adventures - Contact Information</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <h1>Contact Us</h1>
            <p>Got a travel story to share? Questions about our adventures? Drop us a message!</p>
        </header>
        
        <form action="/submit-form" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="example: Kian Artusso" required>
            
            <br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="example: info@gmail.com" required>
            
            <br><br>
            
            <label for="subject">Subject:</label>
            <input type="text" id="subject" placeholder="example: Booking inquiry: Global Adventures" required>
            
            <br><br>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" cols="80" placeholder="Hi, I'm interested in booking a tour for next month. Can you share the upcoming availability, pricing, and itinerary details for a group of two?Thanks![Your Name]"></textarea>

            <br><br>

            <button type="submit" id="submit-button" onclick="alert('Thank you for submitting your experiences!')">Send Message</button> 

        </form>
    </body>
</html>
