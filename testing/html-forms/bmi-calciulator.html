<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>BMI Calculator Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="This content shows how to make a simple Body Mass Index (BMI) calculator form using weight and height inputs.">
    </head>
    <body>
        <form action="/submit-bmi" method="post">
            <div>
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" required>
            </div>

            <br>

            <div>
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" required>
            </div>

            <br>

            <button type="submit">Calculate BMI</button>
        </form>
    </body>
</html>
