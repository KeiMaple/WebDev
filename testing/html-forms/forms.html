<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>HTML Forms</title>
        <meta name="description" content="This content shows how to use html forms.">
    </head>
    <body>
        <main>
            <h1>Login Page</h1>
            <div>
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" placeholder="Alexei Eloquez" required>
            </div>

            <br>

            <div>
                <label for="user-password">Password:</label>
                <input type="password" id="user-password" password="user-password" min="9" maxlength="16" placeholder="user0987" required>
            </div>

            <br>

            <div>
                <label for="user-email">Email:</label>
                <input type="email" id="user-email" email="user-email" placeholder="alexeieloquez@gmail.com" required>
            </div>


        </main>
    </body>
</html>
