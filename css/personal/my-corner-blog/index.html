<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0">
    <meta name="description" content="This is my simple personal cornerstone blog that I made :3">
    <title>My Personal Blog</title>

    <link rel="stylesheet" href="styles.css">
    
    <body>
        <header class="hero">
            <div class="hero-text">
                <h1>Welcome to my blog</h1>
                <p>Hi! I'm Kacey, but you can call me Kei. This is my little corner of the internet where I write about myself and the world around me. So grab a snack and stay a while!</p>
            </div>

            <div class="strips"> <!-- lines the figures in a row for layout, as default is a column -->

                <figure class="strip strip-irl"> <!-- has photo + caption and sets the width -->
                    <div class="strip-frame"> <!-- the wrapper, white-card frame behind the photo -->
                        <img src="images/irl-me-pic.png" alt="Four photobooth irl pictures of me">
                    </div>
                    <figcaption>IRL me</figcaption> <!-- figure caption outside the card, acts as a label -->
                </figure>

                <figure class="strip strip-chibi">
                    <div class="strip-frame">
                        <img src="images/chibi-me-pic.jpg" alt="Four chibi illustration of me">
                    </div>
                    <figcaption>Chibi me</figcaption>
                </figure>

            </div>
        </header>

    </body>
</html>
