<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="a simple music player project. dedicated for one song only.">
    
    <title>Music Player</title>
    <style>
        audio {
            display: block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Music Player</h1>
    <video width="640" height="360" controls autoplay loop>
        <source src="sweet-boy-music-video.mp4" type="video/mp4">
    </video>
    
    <br><br>

    <audio controls>
        <source src="sweet-boy-song.mp3" type="audio/mpeg"> 
        <p>Your browser does not support the audio element.</p>
    </audio>
</body>
</html>
